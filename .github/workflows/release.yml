name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller build.spec --clean --noconfirm

      - name: Create release package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/ai_usage_dash.exe" -DestinationPath "release/ai_usage_dash_windows_x64.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: release/ai_usage_dash_windows_x64.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.0-37

      - name: Build Linux executable
        run: pyinstaller build.spec --clean --noconfirm

      - name: Create release package
        run: |
          tar -czvf release/ai_usage_dash_linux_x64.tar.gz ai_usage_dash

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: release/ai_usage_dash_linux_x64.tar.gz
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
