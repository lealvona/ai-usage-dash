[project]
name = "ai-usage-dash"
version = "1.1.0"
description = "AI usage tracking and visualization dashboard for OpenAI, Claude, Gemini, MiniMax, and Z.ai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "cryptography>=42.0",
    "psutil>=5.9",
    "colorlog>=6.8",
]

[project.optional-dependencies]
gui = [
    "pywebview>=5.0",
]
build = [
    "pyinstaller>=6.3",
    "setuptools<75",
    "pillow>=10.2",
]
viz = [
    "matplotlib>=3.8",
]
all = [
    "ai-usage-dash[gui,viz]",
]

[project.scripts]
ai-dash = "gui_app:cli_main"
ai-dash-browser = "gui_app:cli_browser"

[project.gui-scripts]
ai-dash-gui = "gui_app:cli_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "gui_app.py",
    "enhanced_api_client.py",
    "encryption_manager.py",
    "enhanced_providers",
]

[tool.uv]
package = true
